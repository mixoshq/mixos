# HTTPS for deploy/docker-compose.yml on a bare server: Caddy in front of the
# app, with a certificate from Let's Encrypt for the host in MIXOS_URL.
#
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.https.yml up -d --build
#
# A separate file rather than a profile, so that a host with its own proxy —
# Coolify, Dokploy, anything already holding ports 80 and 443 — never starts a
# second one. Before the first `up`, point the domain's DNS at this server and
# open ports 80 and 443; the certificate is issued on first start.

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    # MIXOS_URL is the full URL, https://mixos.example.com; Caddy takes the
    # host from it, obtains and renews the certificate, and redirects http.
    command: ["caddy", "reverse-proxy", "--from", "${MIXOS_URL:?Set MIXOS_URL in deploy/.env}", "--to", "app:3000"]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      # Certificates and the ACME account. Losing this volume means re-issuing,
      # and Let's Encrypt rate-limits that.
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

volumes:
  caddy-data:
  caddy-config:
