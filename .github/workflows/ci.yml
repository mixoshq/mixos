name: ci

# The only build gate in this repo. Each host builds and deploys the app itself,
# so CI here exists purely to fail a PR before it merges — it produces no
# artifact and pushes nothing.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A force-push or a quick follow-up commit supersedes the run in flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      # For the test step alone: the suites that need Postgres run against it,
      # and skip without it. The password is not a secret; the server lives as
      # long as this job, and no other step is told where it is.
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: throwaway
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
        with:
          # The token stays out of .git/config. The pull request's code runs
          # in this job (npm ci, the generator, the build), and a GitHub App
          # pull request's code comes from a publisher.
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # BLOCKING, and more than a style gate. `eslint.config.mjs` carries the app
      # containment rules — no raw `fetch` or `process.env` in app code, no
      # import off the app import list — and the design-system rules, every one
      # an `error`. The registry generator enforces the containment rules again
      # on every build and every Registry install (scripts/app-containment.ts),
      # so for those this step is the earlier warning; the design-system rules
      # are enforced here and nowhere else.
      #
      # Warnings stay non-fatal: eslint exits non-zero on errors only.
      - name: Lint
        run: npm run lint

      # Dependency advisories, in two passes. What ships (`--omit=dev`) fails on
      # a high advisory; dev tooling fails only on a critical one. A threshold
      # nobody can meet is a threshold everybody learns to ignore: a low
      # advisory in a dev-only transitive must not block a release, and neither
      # must a high one with no fixed release (braces, which reaches only
      # danger and eslint-config-next, as of October 2026).
      #
      # This step is the point of the exercise. The first audit run against this
      # repo returned 2 critical and 6 high — both criticals in the auth library
      # — not because anything regressed, but because nothing was looking.
      - name: Audit dependencies
        run: |
          npm audit --omit=dev --audit-level=high
          npm audit --audit-level=critical

      # BLOCKING, and cheap. MIXOS_REPOSITORY_URL decides which catalogue's
      # checksums an install verifies downloads against, so a value that reaches
      # a release decides what "verified" means on every deployment of it. The
      # variable legitimately points at localhost while the platform and the
      # catalogue are developed against each other — this is what stops that
      # convenience from travelling in a committed file.
      #
      # Runs on every push and PR rather than only on the tag: catching it here
      # means the fix is an edit, where catching it at the tag means recutting a
      # release. See docs/security-architecture.md §31.
      - name: Repository URL is not pinned away from mixos.org
        run: npm run verify:repository-url

      - name: Typecheck
        run: npm run typecheck

      # Node's built-in runner through tsx: no test framework to install.
      # Nothing here needs the generated registry — code that does is split
      # from the rules it applies, and the rules are what is tested (see
      # src/lib/branding/bounded.ts, scripts/brand-checks.ts). The suites that
      # need Postgres skip without MIXOS_TEST_DATABASE_URL; here it names the
      # job's throwaway server, which they share, each under names of its own.
      - name: Tests
        run: npm test
        env:
          MIXOS_TEST_DATABASE_URL: postgres://postgres:throwaway@localhost:5432/postgres

      # `prebuild` regenerates src/generated/app-registry.ts, so this also
      # catches a malformed app.json / connector.json / theme.json manifest, and
      # a theme.css that violates the token contract.
      #
      # The build gets no DATABASE_URL and no secrets, on purpose; the job's
      # throwaway Postgres is for the test step. The Postgres pool is a
      # lazy proxy (src/lib/db/client.ts) and the query builder holds nothing
      # but a reference to it, so nothing touches DATABASE_URL/PG* env vars until
      # a request is served. If this step ever starts failing on a missing env var, that
      # means something began connecting at module scope — fix that, don't add
      # the secret here.
      - name: Build
        run: npm run build
