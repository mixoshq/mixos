name: ci

# The only build gate in this repo. Vercel owns building and deploying the app
# itself (Preview per PR, Production on main), so CI here exists purely to fail
# a PR before it merges — it produces no artifact and pushes nothing.
#
# Replaces the six workflows from the previous self-hosted deploy pipeline
# (image build, image push, cluster deploy, deployment-manifest lint, and a
# container smoke test) — none of which apply on Vercel.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A force-push or a quick follow-up commit supersedes the run in flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # BLOCKING. It was `continue-on-error` while 10 pre-existing react-hooks
      # errors were outstanding; those are fixed and the count is zero, so the
      # exemption is gone.
      #
      # This matters more than a style gate. `eslint.config.mjs` is where the
      # client/server boundary is enforced — no raw `fetch` in app code, no
      # `process.env`, no connector or DB client outside the server tier, no
      # constructing a scoped DB client for another app's prefix. Every one of
      # those is an `error`, and while this step could not fail a PR, all of them
      # were advisory. docs/security-architecture.md §3.3 calls this layer "Build
      # fails on violation"; this line is what makes that sentence true.
      #
      # Warnings stay non-fatal: eslint exits non-zero on errors only.
      - name: Lint
        run: npm run lint

      # Dependency advisories, in two passes. What ships (`--omit=dev`) fails on
      # a high advisory; dev tooling fails only on a critical one. A threshold
      # nobody can meet is a threshold everybody learns to ignore: a low
      # advisory in a dev-only transitive must not block a release, and neither
      # must a high one with no fixed release (braces, which reaches only
      # danger and eslint-config-next, as of October 2026).
      #
      # This step is the point of the exercise. The first audit run against this
      # repo returned 2 critical and 6 high — both criticals in the auth library
      # — not because anything regressed, but because nothing was looking.
      - name: Audit dependencies
        run: |
          npm audit --omit=dev --audit-level=high
          npm audit --audit-level=critical

      # BLOCKING, and cheap. MIXOS_REPOSITORY_URL decides which catalogue's
      # checksums an install verifies downloads against, so a value that reaches
      # a release decides what "verified" means on every deployment of it. The
      # variable legitimately points at localhost while the platform and the
      # catalogue are developed against each other — this is what stops that
      # convenience from travelling in a committed file.
      #
      # Runs on every push and PR rather than only on the tag: catching it here
      # means the fix is an edit, where catching it at the tag means recutting a
      # release. See docs/security-architecture.md §31.
      - name: Repository URL is not pinned away from mixos.org
        run: npm run verify:repository-url

      - name: Typecheck
        run: npm run typecheck

      # Node's built-in runner through tsx: no test framework to install.
      # Nothing here needs a database or the generated registry — code that
      # does is split from the rules it applies, and the rules are what is
      # tested (see src/lib/branding/bounded.ts, scripts/brand-checks.ts).
      - name: Unit tests
        run: npm test

      # `prebuild` regenerates src/generated/app-registry.ts, so this also
      # catches a malformed app.json / connector.json / theme.json manifest, and
      # a theme.css that violates the token contract.
      #
      # No database or secrets are provided on purpose. The Postgres pool is a
      # lazy proxy (src/lib/db/client.ts) and the query builder holds nothing
      # but a reference to it, so nothing touches DATABASE_URL/PG* env vars until
      # a request is served. If this step ever starts failing on a missing env var, that
      # means something began connecting at module scope — fix that, don't add
      # the secret here.
      - name: Build
        run: npm run build
