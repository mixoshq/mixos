name: Danger

# Applies the `os-change` review label and per-app / per-connector / per-theme
# scope labels
# based on which paths a PR touches. See dangerfile.ts.

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  danger:
    # Not for the GitHub App's pull requests, from branches under mixos/: this
    # job runs `npm ci` on the pull request's code with write scopes, and the
    # instance refuses to propose while any workflow would do that for them
    # (docs/security-architecture.md §32). `branches-ignore` can't do this: on
    # a pull_request trigger it filters the target branch, not the head.
    if: ${{ !startsWith(github.head_ref, 'mixos/') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      # Danger reports its verdict as a commit status as well as a comment.
      # Without this it logs "Could not add a commit status, the GitHub token
      # for Danger does not have access rights" on every run — the failure
      # still propagates through the exit code, but the check never appears
      # next to the commit, which is where a reviewer looks for it.
      statuses: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - if: github.event.pull_request.head.repo.full_name == github.repository
        run: npx danger ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # A pull request from a fork gets a read-only token whatever `permissions`
      # says, so Danger can't comment, set a status or add a label, and a plain
      # `danger ci` would fail on that rather than on the pull request. This runs
      # every rule all the same: --text-only reports to this job's log instead of
      # posting, and --failOnErrors fails the job on any `fail`, so the gates
      # (a migration's version bump, an extension added to the core, a pinned
      # repository URL…) hold for outside contributors too. dangerfile.ts skips
      # the labels for a fork.
      - if: github.event.pull_request.head.repo.full_name != github.repository
        run: npx danger ci --text-only --failOnErrors
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
