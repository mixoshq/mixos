# Version updates, weekly. Security updates are separate: they come as soon as
# an advisory is published, whenever Dependabot security updates are on in the
# repository's settings, and this file doesn't hold them back.
#
# Commit messages follow CONTRIBUTING.md, because a release takes its notes from
# them (scripts/release-prep.ts):
#   - fix(deps): a runtime dependency. Listed under Fixes, since what an
#     instance runs changes.
#   - chore(deps-dev): a dev dependency. Left out of the notes.
#   - ci(deps): a GitHub Action. Left out of the notes.

version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Minor and patch updates in one pull request a week; a major update gets
    # its own, since it is the one likely to need code changes.
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 5
    ignore:
      # ESLint 10 breaks eslint-plugin-react, which eslint-config-next pulls in:
      # it calls context.getFilename(), which ESLint 10 removed, so lint fails
      # on every file (#118). Take ESLint majors again once eslint-config-next
      # supports them; minor and patch updates still come.
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      # TypeScript 7 is the native compiler, without the JavaScript API that
      # typescript-eslint and Danger call (ts.transpileModule and the rest), so
      # lint and Danger both fail (#125). Take TypeScript majors again once
      # they support it; minor and patch updates still come.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # Node's types follow the Node MixOS runs on, 24 (.nvmrc and the
      # Dockerfile), not the newest Node: @types/node 26 describes APIs that
      # 24 doesn't have and fails typecheck (#129). Move this with the runtime.
      - dependency-name: "@types/node"
        versions: [">=25"]
    commit-message:
      prefix: fix
      prefix-development: chore
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
      include: scope
